<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OFORI Power Tool Report</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">OFORI Electricals</p>
      <h1>Printable Engineering Report</h1>
      <p class="lede">Saved project summary for load analysis, power factor correction, economics, and harmonics screening.</p>
    </div>
    <nav class="header-actions" aria-label="Report actions">
      <button class="icon-button" type="button" onclick="window.print()">Print</button>
      <a class="button-link" href="index.html">Back to Calculator</a>
    </nav>
  </header>

  <main class="app-shell">
    <section class="results-panel" style="grid-column: 1 / -1;">
      <section class="tab-panel active">
        <div id="report-root" class="report-copy"></div>
      </section>
    </section>
  </main>

  <footer class="app-footer">
    <span>Generated by OFORI Power Tool.</span>
    <span>Screening estimates require engineering verification before procurement or installation.</span>
  </footer>

  <script type="module">
    import { calculateAnalysis } from "./assets/js/power-model.js";
    import { loadState } from "./assets/js/storage.js";
    import { createExecutiveSummary, formatCurrency, formatNumber } from "./assets/js/reporting.js";

    const root = document.getElementById("report-root");
    const state = loadState();

    if (!state) {
      root.innerHTML = "<h2>No Saved Project</h2><p>Run the calculator first, then return to this report page.</p>";
    } else {
      const analysis = calculateAnalysis(state);
      root.innerHTML = `
        ${createExecutiveSummary(analysis)}
        <h2>Calculated Values</h2>
        <table>
          <tbody>
            <tr><th>Total real power</th><td>${formatNumber(analysis.totals.pKw)} kW</td></tr>
            <tr><th>Total reactive power</th><td>${formatNumber(analysis.totals.qKvar)} kVAr</td></tr>
            <tr><th>Total apparent power</th><td>${formatNumber(analysis.totals.sKva)} kVA</td></tr>
            <tr><th>Displacement power factor</th><td>${formatNumber(analysis.totals.displacementPf, 3)}</td></tr>
            <tr><th>True power factor</th><td>${formatNumber(analysis.harmonics.truePf, 3)}</td></tr>
            <tr><th>Recommended correction</th><td>${formatNumber(analysis.correction.qcNeeded)} kVAr</td></tr>
            <tr><th>Monthly energy cost</th><td>${formatCurrency(analysis.economics.energyCost)}</td></tr>
            <tr><th>Monthly reactive cost</th><td>${formatCurrency(analysis.economics.reactiveCost)}</td></tr>
            <tr><th>Monthly savings estimate</th><td>${formatCurrency(analysis.correction.monthlySavings)}</td></tr>
            <tr><th>Harmonics risk</th><td>${analysis.harmonics.risk.level}</td></tr>
          </tbody>
        </table>
        <h2>Loads</h2>
        <table>
          <thead><tr><th>Load</th><th>Type</th><th>P kW</th><th>Q kVAr</th><th>S kVA</th><th>PF</th><th>A</th></tr></thead>
          <tbody>
            ${analysis.loads.map((load) => `
              <tr>
                <td>${load.name}</td>
                <td>${load.type}</td>
                <td>${formatNumber(load.pKw)}</td>
                <td>${formatNumber(load.qKvar)}</td>
                <td>${formatNumber(load.sKva)}</td>
                <td>${formatNumber(load.pf, 3)}</td>
                <td>${formatNumber(load.currentA)}</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
    }
  </script>
</body>
</html>
