<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>PowerSo - Print Summary</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 p-6">
  <div class="max-w-4xl mx-auto">
    <header class="flex items-center justify-between mb-6">
  <h1 class="text-2xl font-bold">PowerSo — Summary Report</h1>
      <div>
        <button id="print-btn" class="px-4 py-2 bg-blue-600 text-white rounded">Print / Save as PDF</button>
        <a id="back-link" href="power.html" class="ml-3 text-sm text-blue-600">Back to Calculator</a>
      </div>
    </header>

    <section id="summary" class="mb-6 bg-gray-50 p-4 rounded">
      <h2 class="text-lg font-semibold mb-2">Economics Summary</h2>
      <table class="w-full text-sm">
        <tbody>
          <tr><td class="font-medium">Energy Consumption</td><td id="sb-energy-consumption" class="text-right">-</td></tr>
          <tr><td class="font-medium">Energy Cost</td><td id="sb-energy-cost" class="text-right">-</td></tr>
          <tr><td class="font-medium">Reactive Energy</td><td id="sb-reactive-energy" class="text-right">-</td></tr>
          <tr><td class="font-medium">Reactive Cost</td><td id="sb-reactive-cost" class="text-right">-</td></tr>
          <tr><td class="font-medium">Corrected Reactive Cost</td><td id="sb-corrected-reactive-cost" class="text-right">-</td></tr>
          <tr><td class="font-medium">Energy Loss Savings</td><td id="sb-energy-savings" class="text-right">-</td></tr>
          <tr><td class="font-medium">Total Potential Savings</td><td id="sb-total-savings" class="text-right font-semibold text-blue-800">-</td></tr>
        </tbody>
      </table>
    </section>

    <section id="devices" class="mb-6">
      <h2 class="text-lg font-semibold mb-2">Devices</h2>
      <table class="w-full text-sm border-collapse border border-gray-200">
        <thead class="bg-gray-100"><tr><th class="p-2 text-left">Device</th><th class="p-2 text-right">P (kW)</th><th class="p-2 text-right">Q (kVAr)</th><th class="p-2 text-right">S (kVA)</th><th class="p-2 text-right">PF</th><th class="p-2 text-right">I (A)</th></tr></thead>
        <tbody id="sb-devices-body"></tbody>
      </table>
    </section>

  <footer class="text-xs text-gray-500">Generated by PowerSo — Home of smarter power</footer>
  </div>

  <script>
    const STORAGE_KEY = 'powerwise_state_v1';
    function loadState() {
      try { const raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : null; } catch(e) { return null; }
    }

    function fmt(v, suffix='') { return v === null || v === undefined ? '-' : v + (suffix || ''); }

    const state = loadState();
    if (state) {
      const consumption = (parseFloat(state.devices?.reduce((acc,d)=> acc + (parseFloat(d.P)||0),0))||0) * (parseFloat(state.operatingHours)||0) * (parseFloat(state.operatingDays)||0);
      // Fill economics if cost calculation available via Power page; otherwise show 0s
      document.getElementById('sb-energy-consumption').textContent = state.energyConsumption ?? fmt(consumption, ' kWh/month');
      document.getElementById('sb-energy-cost').textContent = state.energyCost ?? '-';
      document.getElementById('sb-reactive-energy').textContent = state.reactiveEnergy ?? '-';
      document.getElementById('sb-reactive-cost').textContent = state.reactiveCost ?? '-';
      document.getElementById('sb-corrected-reactive-cost').textContent = state.correctedReactiveCost ?? '-';
      document.getElementById('sb-energy-savings').textContent = state.energySavings ?? '-';
      document.getElementById('sb-total-savings').textContent = state.totalSavings ?? '-';

      const tbody = document.getElementById('sb-devices-body');
      const devices = state.devices || [];
      devices.forEach((d, i)=>{
        const P = parseFloat(d.P)||0; const Q = parseFloat(d.Q)||0; const S = parseFloat(d.S)||Math.sqrt(P*P+Q*Q);
        const pf = d.pf !== null && d.pf !== undefined ? d.pf : (S!==0? (P/S) : '-');
        const row = document.createElement('tr');
        row.innerHTML = `<td class="p-2">${d.equipment||('Device '+(i+1))}</td><td class="p-2 text-right">${P.toFixed(2)}</td><td class="p-2 text-right">${Q.toFixed(2)}</td><td class="p-2 text-right">${S.toFixed(2)}</td><td class="p-2 text-right">${typeof pf === 'number' ? pf.toFixed(2) : pf}</td><td class="p-2 text-right">-</td>`;
        tbody.appendChild(row);
      });
    } else {
      document.getElementById('sb-energy-consumption').textContent = 'No saved data';
    }

    document.getElementById('print-btn').addEventListener('click', ()=> window.print());
  </script>
</body>
</html>
